<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="km-icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA033"/>
      <stop offset="50%" stop-color="#FF5E00"/>
      <stop offset="100%" stop-color="#D93600"/>
    </linearGradient>
    <filter id="km-icon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- AMOLED Black Background -->
  <rect width="512" height="512" rx="112" fill="#000000"/>
  <rect width="508" height="508" x="2" y="2" rx="110" stroke="#FF5E00" stroke-opacity="0.35" stroke-width="3"/>

