    <path d="M300 24 C306 20, 314 22, 320 28 L380 76 C386 82, 384 92, 376 94 L338 98 L354 136 C356 140, 352 144, 348 144 L328 144 C324 144, 320 140, 318 136 L304 100 L294 128 C290 136, 280 134, 280 126 L280 40 C280 32, 288 24, 300 24 Z" fill="url(#km-icon-grad)"/>

