<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ktm-brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00"/>
      <stop offset="45%" stop-color="#FF5A00"/>
      <stop offset="100%" stop-color="#D93600"/>
    </linearGradient>
    <filter id="ktm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="ktm-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120D08"/>
      <stop offset="50%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
  </defs>
  
  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#ktm-bg-grad)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" stroke="rgba(255, 165, 80, 0.22)" stroke-width="2"/>
  
  <!-- Subtle Ambient Orange Glow behind mark -->
  <circle cx="256" cy="256" r="140" fill="#FF5A00" opacity="0.12" filter="url(#ktm-glow)"/>
  
  <!-- Scaled and Centered KTM Monogram Geometric Paths -->
  <!-- Scaled ~2.2x from 132x152, centered at offset (110, 88) -->
  <g transform="translate(110, 88) scale(2.2)" filter="url(#ktm-glow)">
    <!-- Left vertical stem (K) -->
    <line x1="5" y1="2" x2="5" y2="150" stroke="url(#ktm-brand-grad)" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Top diagonal branch (K upper) -->
    <line x1="5" y1="74" x2="60" y2="4" stroke="url(#ktm-brand-grad)" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Mid diagonal connector (K lower to T stem) -->
    <line x1="36" y1="34" x2="66" y2="72" stroke="url(#ktm-brand-grad)" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Center vertical stem (T & M) -->
    <line x1="65.5" y1="72" x2="65.5" y2="150" stroke="url(#ktm-brand-grad)" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Upper horizontal bar (T crossbar) -->
    <line x1="65" y1="69" x2="112" y2="69" stroke="url(#ktm-brand-grad)" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Lower horizontal bar (M connector) -->
    <line x1="65" y1="111" x2="126" y2="111" stroke="url(#ktm-brand-grad)" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Right vertical stem (M right edge) -->
    <line x1="126.5" y1="2" x2="126.5" y2="150" stroke="url(#ktm-brand-grad)" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
